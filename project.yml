name: FreeDisplay
options:
  bundleIdPrefix: com.freedisplay
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"

targets:
  FreeDisplay:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: FreeDisplay
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freedisplay.app
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "FreeDisplay - Free & Open Source"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: FreeDisplay/FreeDisplay.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_REQUIRED: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: FreeDisplay/FreeDisplay-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "FreeDisplay needs Screen Recording access to show live previews of each display."
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
